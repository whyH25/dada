spring.application.name=backend
spring.profiles.active=local

# ── Reverse Proxy (Nginx) 헤더 신뢰 ──────────────────────────────
server.forward-headers-strategy=framework

# ── MyBatis ──────────────────────────────────────────────────────
mybatis.mapper-locations=classpath:/mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ── 파일 업로드 크기 제한 ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ── 이메일 (SMTP) ────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── GMS AI Gateway ───────────────────────────────────────────────
openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1
openai.chat-path=/chat/completions
openai.api-key=${OPENAI_API_KEY:}

# ── Google Speech ─────────────────────────────────────────────────
google.api-key=${GOOGLE_API_KEY:}

# ── Google Cloud Storage ─────────────────────────────────────────
# 비공개 버킷 (이력서/포트폴리오)
gcs.bucket=${GCS_BUCKET:}
gcs.credentials-path=${GCS_CREDENTIALS_PATH:}
# 공개 버킷 (썸네일)
gcs.thumbnail-bucket=${GCS_THUMBNAIL_BUCKET:}

# ── 토스페이먼츠 ────────────────────────────────────────────────────
toss.secret-key=${TOSS_SECRET_KEY:}

# ── 프론트엔드 기본 URL (소셜 로그인 완료 후 redirect 대상) ───────────
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ── 소셜 로그인 (Google OAuth2) ────────────────────────────────────
# 카카오는 이메일(account_email) 스코프가 비즈 앱 전환 전엔 막혀있어 일단 보류
# (재추가 시 registration.kakao.*, provider.kakao.* 설정 + SecurityConfig의
#  customUserOAuth2Service 연결 한 줄만 복원하면 됨. CustomUserOAuth2Service.java는 유지됨)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
