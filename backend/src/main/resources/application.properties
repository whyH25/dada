spring.application.name=backend
spring.profiles.active=local

# ── MyBatis ──────────────────────────────────────────────────────
mybatis.mapper-locations=classpath:/mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ── 파일 업로드 크기 제한 ─────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ── 이메일 (SMTP) ────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── GMS AI Gateway ───────────────────────────────────────────────
# 실제 키는 application-local.properties 에만 작성 (gitignore 됨)
openai.base-url=https://gms.ssafy.io/gmsapi/api.openai.com/v1
openai.chat-path=/chat/completions
openai.api-key=${OPENAI_API_KEY:}

# ── Google Speech ─────────────────────────────────────────────────
google.api-key=${GOOGLE_API_KEY:}

# ── Google Cloud Storage (이력서/포트폴리오 원본 저장, 비공개 버킷) ──
gcs.bucket=${GCS_BUCKET:}
gcs.credentials-path=${GCS_CREDENTIALS_PATH:}

# ── 토스페이먼츠 ────────────────────────────────────────────────────
# 실제 키는 application-local.properties 에만 작성 (gitignore 됨)
toss.secret-key=${TOSS_SECRET_KEY:}
